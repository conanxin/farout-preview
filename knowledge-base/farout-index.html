er publications ♨️ Before Harbin Hot Springs became a clothing-optional New Age spa operated by Heart Consciousness Church , it was the home of a commune called Harbinger starting in 1968. Don Hamrick was its unlikely charismatic leader. He was an architect, physicist and futurist interested in human potential, metaphysics and psychic phenomena, and he had a near-death experience in 1966 which changed him. He was also friends with the Grateful Dead and Bill Graham, who organized concerts to benefit the commune like the Celestial Synapse event at Fillmore West in 1969, which deadheads still talk about . Under Hamrick, Harbinger published some beautiful far-out publications around 1969, like The Changes, which featured work from Victor Moscoso, R. Crumb, Rick Griffin, Stanley Mouse and Lee Conklin. Harbinger had about 120 members, with 27 shared vehicles that they maintained. Hamrick was also an avid pilot and flew his Cessna Twin airplane around almost daily to and from lecture halls, and there’s some rumors online that he was a CIA operative. The commune only lasted a sh", "image_count": 18, "image_urls": ["https://faroutcompany.com/wp-content/uploads/711720306_18534424177078971_1942879286748078731_n.jpg", "https://faroutcompany.com/wp-content/uploads/711588538_18534424186078971_4456201005763409242_n.jpg", "https://faroutcompany.com/wp-content/uploads/710288352_18534424195078971_3874990555883033679_n.jpg", "https://faroutcompany.com/wp-content/uploads/710556522_18534424204078971_1413122165820380771_n.jpg", "https://faroutcompany.com/wp-content/uploads/709844534_18534424213078971_6736971930104602411_n.jpg", "https://faroutcompany.com/wp-content/uploads/711885898_18534424231078971_313359337590785972_n.jpg", "https://faroutcompany.com/wp-content/uploads/709882956_18534424222078971_7842659576285149527_n.jpg", "https://faroutcompany.com/wp-content/uploads/710474399_18534424240078971_4427245536174384355_n.jpg", "https://faroutcompany.com/wp-content/uploads/708979753_18534 first-ever fan letter from Raymond and then had Living on the Earth reviewed in The New York Times by him. She wrote, “My toes caressed the soil of Vermont. Everything here is very, very old. Sometimes you have to part the spirits like curtains as you pass, they crowd about so thickly.”", "image_count": 9, "image_urls": ["https://faroutcompany.com/wp-content/uploads/583598464_18495392788078971_3649069475468143819_n.jpg", "https://faroutcompany.com/wp-content/uploads/582617221_18495392797078971_1618930887449539862_n.jpg", "https://faroutcompany.com/wp-content/uploads/581808044_18495392806078971_3276490114023894469_n.jpg", "https://faroutcompany.com/wp-content/uploads/582715184_18495392815078971_7072478402127813870_n.jpg", "https://faroutcompany.com/wp-content/uploads/582599052_18495392824078971_271245402396472652_n.jpg", "https://faroutcompany.com/wp-content/uploads/581227641_18495392833078971_5772358814007596328_n.jpg", "https://faroutcompany.com/wp-content/uploads/584074194_18495392851078971_2521635816207574983_n.jpg", "https://faroutcompany.com/wp-content/uploads/582197081_18495392848078971_5876475992999162263_n.jpg", "https://faroutcompany.com/wp-content/uploads/583128876_18495392860078971_8248770315505655674_n.jpg"], "image_alts": ["", "", "", "", "", "", "", "", ""], "image_captions": ["", "", "", "", "", "", "", "", ""], "farther_out_links": [], "topic_category": "设计与插画", "scores": {"story": 3, "visual": 5, "depth": 1, "interest": 2, "transform": 2, "total": 13}, "primary_topic": "公社与生活实验", "secondary_topic": "公社生活", "era_keywords": ["1973"], "people_keywords": ["Alicia Bay", "Bay Laurel", "Books Alicia", "Cosmic Profit", "Home Comfort", "Make Money", "New England", "Raymond Mungo", "Raymund Mungo", "The New"], "place_keywords": ["England", "LA", "New England", "New York", "Total Loss Farm", "Vermont"], "media_keywords": ["book", "commune", "drawing", "farm", "illustration"], "content_use_cases": ["中文长文", "X thread", "展览卡片", "视觉 prompt", "设计参考", "知识库卡片"], "res ling of Ken Brown’s innovative visuals that were projected live alongside concert performances at the Boston Tea Party venue from 1967-1969.", "all_text_excerpt": "A sampling of Ken Brown’s innovative visuals that were projected live alongside concert performances at the Boston Tea Party venue from 1967-1969. Rather than relying on the standard “oil and dye on overhead projectors” approach, Brown shot hundreds of reels of Super 8 film specifically to be projected during concerts. His techniques included double and triple exposures, hand-drawn and collage animation, kaleidoscopic editing and slow-motion portraiture. One of his favorite tools was a special Super 8 camera that allowed him to rewind an entire cartridge and expose it multiple times, creating dense, layered imagery years before digital compositing existed.", "image_count": 0, "image_urls": [], "image_alts": [], "image_captions": [], "farther_out_links": [], "topic_category": "设计与插画", "scores": {"story": 1, "visual": 2, "depth": 1, "interest": 4, "transform": 4, "total": 12}, "primary_topic": "迷幻视觉", "secondary_topic": "迷幻图案", "era_keywords": ["1967", "1969"], "people_keywords": ["Boston Tea", "Ken Brown", "Party New", "Party Visuals", "Video Boston"], "place_keywords": ["Boston", "Boston Tea Party", "England", "LA", "New England"], "media_keywords": ["concert", "film", "venue", "video"], "content_use_cases": ["设计参考", "知识库卡片"], "research_value_score": 1, "visual_value_score": 2, "content_value_score": 2, "p2_total_score": 5}, {"title": "Lama Foundation, 1970s", "url": "https://faroutcompany.com/lama-foundation-1970s/", "slug": "lama-foundation-1970s", "date": "2026-06-14T12:18:47-05:00", "categories": ["Underground Press", "communes", "Lama Foundation"], "tags": ["Underground Press", "communes", "Lama Foundation", "New Mexico"], "first_paragraph": "‘70s photos of the Lama Foundation in the mountains north of Taos, New Mexico, by Peter Simon (pictured in the wheelbarrow in the last photo) and Henri Cartier-Bresson.", "all_text_excerpt": "‘70s photos of the Lama Foundation in the mountains north of Taos, New Mexico, by Peter Simon (pictured in the wheelbarrow in the last photo) and Henri Cartier-Bresson. The Lama Foundation was one of the most influential and enduring spiritual communes. Ram Dass brought his initial manuscript for what became ‘Be Here Now’ there after returning from India, and Lama residents edited, illustrated and laid out the text. It became a huge commercial hit and proceeds from its sales helped fund the Lama Foundation for years. A catastrophic wildfire swept through the property in 1996 but it was rebuilt and still survives, and visitors are welcome in the summer.", "image_count": 20, "image_urls": ["https://faroutcompany.com/wp-content/uploads/723961558_18538131067078971_3772758033591285502_n.jpg", "https://faroutcompany.com/wp-content/uploads/723904471_18538131076078971_5168024867905557564_n-1.jpg", "https://faroutcompany.com/wp-content/uploads/722489571_18538131085078971_7022264172827301_n-1.jpg", "https://faroutcompany.com/wp-content/uploads/723573149_18538131100078971_4710604763394602820_n-1.jpg", "https://faroutcompany.com/wp-content/uploads/724005065_18538131103078971_6577263284242890159_n-1.jpg", "https://faroutcompany.com/wp-content/uploads/723240541_18538131118078971_4075111621859073470_n.jpg", "https://faroutcompany.com/wp-content/uploads/722666416_18538131121078971_6613674928519380834_n.jpg", "https://faroutcompany.com/wp-content/uploads/723852829_18538131148078971_6839938921778549861_n-1.jpg", "https://faroutcompany.com/wp-content/uploads/722204586_18538131130078971_2652694640397256543_n.jpg", "https://faroutcompany.com/wp-content/uploads/723988398_18538131145078971_7936623247327398502_n.jpg", "https://faroutcompany.com/wp-content/uploads/723987977_18538131259078971_6745399508698618249_n.jpg", "https://faroutcompany.com/wp-content/uploads/723562276_18538131277078971_2165046070125670866_n.jpg", "https://faroutcompany.com/wp-content/uploads/724414787_18538131274078971_8888357889474120750_n.jpg", "https://faroutcompany.com/wp-content/uploads/723746773_18538131286078971_3848157251208212776_n.jpg", "https://faroutcompany.com/wp-content/uploads/723137235_18538131295078971_4246148177318500187_n.jpg", "https://faroutcompany.com/wp-content/uploads/724080165_18538131313078971_1825105435577458971_n.jpg", "https://faroutcompany.com/wp-content/uploads/721466288_18538131340078971_3928203936853673243_n.jpg", "https://faroutcompany.com/wp-content/uploads/722858409_18538131319078971_4954106294484676721_n-1.jpg", "https://faroutcompany.com/wp-content/uploads/724086956_18538131337078971_9110868982979496991_n.jpg", "https://faroutcompany.com/wp-content/uploads/724230518_18538131322078971_5332131647258782225_n.jpg"], "image_alts": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "image_captions": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "farther_out_links": [], "topic_category": "设计与插画", "scores": {"story": 1, "visual": 5, "depth": 1, "interest": 2, "transform": 3, "total": 12}, "primary_topic": "地下出版", "secondary_topic": "地下报刊", "era_keywords": ["1970s"], "people_keywords": ["Be Here", "Henri Cartier", "Lama Foundation", "New Mexico", "Peter Simon", "Ram Dass", "The Lama", "Underground Press"], "place_keywords": ["India", "LA", "Lama Foundation"], "media_keywords": ["commune", "press"], "content_use_cases": ["展览卡片", "视觉 prompt", "设计参考", "知识库卡片"], "research_value_score": 3, "visual_value_score": 5, "content_value_score": 2, "p2_total_score": 10}, {"title": "Suzy Creamcheese, 1967", "url": "https://faroutcompany.com/suzy-creamcheese-1967/", "slug": "suzy-creamcheese-1967", "date": "2026-06-04T12:03:13-05:00", "categories": ["Records", "Video", "Frank Zappa"], "tags": ["Records", "Video", "Frank Zappa", "London"], "first_paragraph": "Suzy Creamcheese was stopped for an interview on the BBC’s ‘Man Alive’ TV series, at the 14 Hour Technicolor Dream benefit event for the International Times in London, 1967.", "all_text_excerpt": "Suzy Creamcheese was stopped for an interview on the BBC’s ‘Man Alive’ TV series, at the 14 Hour Technicolor Dream benefit event for the International Times in London, 1967. Who was Suzy Creamcheese? Technically it was a character played by various women who worked with Frank Zappa and the Mothers of Invention. According to author Barry Miles, “Suzy Creamcheese was a generic name that Frank Zappa gave to the group of Jewish girls, fans of the Mothers of Invention, who hung out at Ratner’s Dairy Restaurant on Fairfax” (I think he must have meant Canter’s Deli ). The original Suzy on the Mothers’ ‘Freak Out’ record was Jeannie Vassoir. And then Pamela Zarubica was Suzy on other albums. This Suzy is Susan Zieger and she was briefly married to John Hopkins, editor and co-founder of International Times. She became famous in the underground from this TV spot and maintained that she was the original inspiration for the Suzy character that became part of Frank Zappa lore. The 14 Hour Technicolor Dream was a legendary benefit concert held in the Great Hall of Alexandra Palace in London, featuring Pink Floyd, Soft Machine, Tomorrow, The Crazy World of Arthur Brown, Yoko Ono and dozens of oth", "image_count": 0, "image_urls": [], "image_alts": [], "image_captions": [], "farther_out_links": [], "topic_category": "设计与插画", "scores": {"story": 3, "visual": 1, "depth": 3, "interest": 3, "transform": 2, "total": 12}, "primary_topic": "迷幻视觉", "secondary_topic": "迷幻图案", "era_keywords": ["1967"], "people_keywords": ["Alexandra Palace", "Arthur Brown", "Barry Miles", "Dairy Restaurant", "Frank Zappa", "Freak Out", "Great Hall", "Hour Technicolor", "International Times", "Jeannie Vassoir"], "place_keywords": ["LA", "London"], "media_keywords": ["album", "concert", "record", "tv", "video"], "content_use_cases": ["中文长文", "X thread", "播客选题", "设计参考", "知识库卡片"], "research_value_score": 3, "visual_value_score": 2, "content_value_score": 1, "p2_total_score": 6}, {"title": "Wheeler’s Ranch", "url": "https://faroutcompany.com/wheelers-ranch/", "slug": "wheelers-ranch", "date": "2026-05-15T11:57:03-05:00", "categories": ["Underground Press", "Alicia Bay Laurel", "communes"], "tags": ["Underground Press", "Alicia Bay Laurel", "communes", "Sonoma County"], "first_paragraph": "Early ‘70s shots from Wheeler’s Ranch in Sonoma County by Bob Fitch and Robert Altman. It was a 320-acre commune on Coleman Valley Road in Occidental, north of Bodega Bay, on land owned by Bill Wheeler, a painter from Connecticut who inherited a fortune from his family’s early sewing machine business.", "all_text_excerpt": "Early ‘70s shots from Wheeler’s Ranch in Sonoma County by Bob Fitch and Robert Altman. It was a 320-acre commune on Coleman Valley Road in Occidental, north of Bodega Bay, on land owned by Bill Wheeler, a painter from Connecticut who inherited a fortune from his family’s early sewing machine business. When the nearby Morningstar Ranch commune was shut down by authorities, Wheeler welcomed people there to live on his land. Before long there were 300 hippies inhabiting self-erected cabins and makeshift structures on his remote property. One day in May of 1973, while Wheeler was out of town, bulldozers sent by county officials rumbled onto the land and smashed his house and studio. When he returned a few days later, he and the residents set fire to the remaining structures before the bulldozers were set to come back. Wheeler then moved to Bolinas, and came back a few years later after a friend had bought out the neighbor who had started the county crackdown. He took up art again there and enjoyed success as a landscape painter. See more of Bob Fitch’s photos of Wheeler’s Ranch here .", "image_count": 19, "image_urls": ["https://faroutcompany.com/wp-content/uploads/700134681_18531185047078971_5285494508309596538_n.jpg", "https://faroutcompany.com/wp-content/uploads/699940247_185311850560789 ltman, but this one is from Rhyder McClure (1970). A Google search turned up hisNew York Timesobituaryfrom 2014:", "all_text_excerpt": "Most of the great San Francisco Good Times cover photos are from Robert Altman, but this one is from Rhyder McClure (1970). A Google search turned up his New York Times obituary from 2014: “In his seventy-one years, Rhyder lived many lives. Throughout his varied career, he was a freelance photographer for the Associated Press (his photos of the 1969 People’s Park Riots are in the Library of Congress); an inventor (in 1973 The New York Times dubbed him a “latter-day Leonardo da Vinci”); a food columnist (his articles ran in the St. Petersburg Times , the LA Times , and the Washington Post ); an author (he published over thirty books on computer processing); a businessman (he founded the New York Nanny Cam Company); and a collector (his vintage BMW motorcycles often won “Best in Show”). An avid traveler, Rhyder lived in and visited countries across the globe, including Spain, Morocco, and Fiji, but he was most at home in New York City, where he lived for over 35 years, primarily in Greenwich Village.” 🙏", "image_count": 1, "image_urls": ["https://faroutcompany.com.dream.website/wp-content/uploads/dkdkdkd.png"], "image_alts": [""], "image_captions": [""], "farther_out_links": [], "topic_category": "设计与插画", "scores": {"story": 3, "visual": 2, "depth": 1, "interest": 2, "transform": 4, "total": 12}, "primary_topic": "地下出版", "secondary_topic": "地下报刊", "era_keywords": ["1969", "1970", "1973"], "people_keywords": ["Associated Press", "Good Times", "Greenwich Village", "Nanny Cam", "New York", "Park Riots", "Petersburg Times", "Rhyder McClure", "Robert Altman", "San Francisco"], "place_keywords": ["LA", "New York", "San Francisco"], "media_keywords": ["book", "cover", "press"], "content_use_cases": ["中文长文", "X thread", "设计参考", "知识库卡片"], "research_value_score": 1, "visual_value_score": 3, "content_value_score": 2, "p2_total_score": 6}, {"title": "Brad Johannsen October Vibes", "url": "https://faroutcompany.com/brad-johannsen-october-vibes/", "slug": "brad-johannsen-october-vibes", "date": "2021-10-27T23:40:00-05:00", "categories": ["Books", "Brad Johannsen"], "tags": ["Books", "Brad Johannsen"], "first_paragraph": "Late October vibes from Brad Johannsen’sOccupied Spacesbook, 1977. An anonymousAmazon reviewis the closest thing we have to a biography:", "all_text_excerpt": "Late October vibes from Brad Johannsen’s Occupied Spaces book, 1977. An anonymous Amazon review is the closest thing we have to a biography: “I knew Brad during his most artistically productive period. He lived in Cobble Hill, Brooklyn with the family of his artistic promoter, Howard Bloom. Brad arrived in New York around 1968, at about 19 years old, an already highly developed and gifted artist. I know nothing of his artistic training or background, although I know he was raised in Connecticut. He was tall with a large, blond afro. I knew psychedelic drugs fired his prolific imagination. I sense that he used the geometrically reconfigured reality of his drug experiences to create the unusual environments found in his work. If you look carefully at the faces he painted, It’s obvious he could have easily been a successful portrait artist. But that possibility apparently didn’t interest him. Brad was active mainly during the seventies, as far as I know. He died in his sixties around 2015.”", "image_count": 1, "image_urls": ["https://faroutcompany.com.dream.website/wp-content/uploads/248678621_584028699317175_8924832576789669410_n-819x1024.jpg"], "image_alts": [""], "image_captions": [""], "farther_out_links": [], "topic_category": "迷幻海报", "scores": {"story": 5, "visual": 2, "depth": 1, "interest": 2, "transform": 2, "total": 12}, "primary_topic": "迷幻视觉", "secondary_topic": "迷幻图案", "era_keywords": ["1968", "1977"], "people_keywords": ["Books Brad", "Brad Johannsen", "Cobble Hill", "Howard Bloom", "Late October", "New York", "Occupied Spaces", "October Vibes"], "place_keywords": ["LA", "New York"], "media_keywords": ["book"], "content_use_cases": ["中文长文", "X thread", "播客选题", "设计参考", "知识库卡片"], "research_value_score": 1, "visual_value_score": 3, "content_value_score": 1, "p2_total_score": 5}, {"title": "Mt. Philo Commune, 1973", "url": "https://faroutcompany.com/mt-philo-commune/", "slug": "mt-philo-commune", "date": "2026-05-31T09:59:16-05:00", "categories": ["Hippie Business", "Video", "communes"], "tags": ["Hippie Business", "Video", "communes", "New England", "Vermont"], "first_paragraph": "1973 footage from the Mt. Philo Commune in Charlotte, Vermont, about 20 minutes south of Burlington. Shot by Robert Machover and Michael Singer.", "all_text_excerpt": "1973 footage from the Mt. Philo Commune in Charlotte, Vermont, about 20 minutes south of Burlington. Shot by Robert Machover and Michael Singer. Mt. Philo might have been the most influential Vermont commune and had a lasting impact on the state. Members created Burlington food co-ops that became today’s popular City Market / Onion River Co-ops (best grocery store), as well as the People’s Free Clinic which became today’s Community Health Centers , and The Schoolhouse Learning Center which is still a thriving independent school. Former member Bridget Downey-Meyer has talked about how easy it was do these things then because of the lack of regulations relative to today. After existing as a historic inn off and on for many years, the location is now condos 🫠 but there is still one suite available for short-term rentals . It has as an epic view of Lake Champlain out to the Adirondacks. Watch the full documentary here .", "image_count": 0, "image_urls": [], "image_alts": [], "image_captions": [], "farther_out_links": [], "topic_category": "公社生活", "scores": {"story": 3, "visual": 0, "depth": 3, "interest": 3, "transform": 2, "total": 11}, "primary_topic": "公社与生活实验", "secondary_topic": "公社生活", "era_keywords": ["1973"], "people_keywords": ["Bridget Downey", "City Market", "Community Health", "Free Clinic", "Hippie Business", "Lake Champlain", "Learning Center", "Michael Singer", "New England", "Onion River"], "place_keywords": ["England", "LA", "Mt. Philo", "New England", "Vermont"], "media_keywords": ["commune", "community", "video"], "content_use_cases": ["中文长文", "X thread", "播客选题", "知识库卡片"], "research_value_score": 5, "visual_value_score": 2, "content_value_score": 1, "p2_total_score": 8}, {"title": "Tree Frog Commune, Vermont", "url": "https://faroutcompany.com/tree-frog-commune/", "slug": "tree-frog-commune", "date": "2026-05-22T14:01:12-05:00", "categories": ["Underground Press", "communes", "New England"], "tags": ["Underground Press", "communes", "New England", "photography", "Vermont"], "first_paragraph": "Vermont commune vibes from photographerPeter Simon. Simon (brother of Carly and son of the founder of Simon & Schuster) started Tree Frog Commune in 1970 with Harry Saxman, after they bought an 80-acre farm down the road from Total Loss Farm for $62,500. It was located in Guilford, VT, just over the Massachusetts line, and had a looser “gentleman farmer” vibe than the more hard-core communes further north.", "all_text_excerpt": "Vermont commune vibes from photographer Peter Simon . Simon (brother of Carly and son of the founder of Simon & Schuster) started Tree Frog Commune in 1970 with Harry Saxman, after they bought an 80-acre farm down the road from Total Loss Farm for $62,500. It was located in Guilford, VT, just over the Massachusetts line, and had a looser “gentleman farmer” vibe than the more hard-core communes further north. Tree Frog Commune only lasted a few years. After he sold the farm, Simon bought a shack in Gay Head (now Aquinnah) on Martha’s Vineyard, and was married to his wife Ronni on the Gay Head cliffs in a ceremony officiated by Ram Dass. Hard to get an exact count but Vermont had probably around 200 communes at one point, making it one of the highest per-capita concentrations of communes in the country, with names like New Morning, Wooden Shoe, Toad Hall, Mullein Hill and Pie in the Sky. See more of Peter’s photos of Tree Frog Commune on the Massachusetts Digital Commonwealth site .", "image_count": 20, "image_urls": ["https://faroutcompany.com/wp-content/uploads/705387984_18532772134078971_5941187339675362879_n.jpg", "https://faroutcompany.com/wp-content/uploads/706488965_18532772143078971_9176675953845814087_n.jpg", "https://faroutcompany.com/wp-content/uploads/704851513_18532772152078971_7468684657802938453_n.jpg", "https://faroutcompany.com/wp-content/uploads/706170564_18532772161078971_4150911638467430244_n.jpg", "https://faroutcompany.com/wp-content/uploads/706091353_18532772170078971_2565166911414998136_n.jpg", "https://faroutcompany.com/wp-content/uploads/704751898_18532772179078971_6760392204868035575_n.jpg", "https://faroutcompany.com/wp-content/uploads/705053298_18532772188078971_1665152595827842815_n.jpg", "https://faroutcompany.com/wp-content/uploads/705185572_18532772197078971_850220123338893277_n.jpg", "https://faroutcompany.com/wp-content/uploads/704032361_18532772206078971_7342542174907300149_n.jpg", "https://faroutcompany.com/wp-content/uploads/705692911_18532772215078971_8816642580872810590_n.jpg", "https://faroutcompany.com/wp-content/uploads/705482093_18532772224078971_3342708380817921149_n.jpg", "https://faroutcompany.com/wp-content/uploads/704527664_18532772236078971_1770091380680445276_n.jpg", "https://faroutcompany.com/wp-content/uploads/705860093_18532772245078971_3699125591312525034_n.jpg", "https://faroutcompany.com/wp-content/uploads/704827524_18532772263078971_4146572524327347722_n.jpg", "https://faroutcompany.com/wp-content/uploads/705387718_18532772254078971_3001331146996628665_n.jpg", "https://faroutcompany.com/wp-content/uploads/704972280_18532772284078971_4834910640350181277_n.jpg", "https://faroutcompany.com/wp-content/uploads/706134425_18532772275078971_3385407991751870841_n.jpg", "https://faroutcompany.co ue", "True Light", "Tufts University", "Video Boston"], "place_keywords": ["Boston", "Boston Common", "England", "LA", "New England"], "media_keywords": ["book", "tv", "video"], "content_use_cases": ["知识库卡片"], "research_value_score": 1, "visual_value_score": 2, "content_value_score": 1, "p2_total_score": 4}, {"title": "Sausalito, 1974", "url": "https://faroutcompany.com/sausalito-1974/", "slug": "sausalito-1974", "date": "2026-03-15T11:53:20-05:00", "categories": ["Video", "houseboats", "Sausalito"], "tags": ["Video", "houseboats", "Sausalito"], "first_paragraph": "Footage from the Sausalito hippie houseboat scene circa 1974. From ‘Last Free Ride’ by Roy Nolan and Saul Rouda, and starring Mary Moffett (who lived at Gate 5) and Joe Tate. The epic tall boat is the Madonna (also called the Tower) by Chris Roberts, which burned down in 1975. He also built the famous Owl houseboat, which is still standing.", "all_text_excerpt": "Footage from the Sausalito hippie houseboat scene circa 1974. From ‘Last Free Ride’ by Roy Nolan and Saul Rouda, and starring Mary Moffett (who lived at Gate 5) and Joe Tate. The epic tall boat is the Madonna (also called the Tower) by Chris Roberts, which burned down in 1975. He also built the famous Owl houseboat, which is still standing. An unnamed neighbor was quoted by the local paper when the Madonna burned: “Well, I was just peaking on peyote, which I had been eating all day, and just getting out of the bath tub when I heard like this huge crash, and saw this huge flame shooting out of the Tower. For a minute I thought I was having an hallucination, and then it hit me that the Tower was really burning, and I went outside and started yelling, ‘Fire! Fire in the Tower!’’’", "image_count": 0, "image_urls": [], "image_alts": [], "image_captions": [], "farther_out_links": [], "topic_category": "设计与插画", "scores": {"story": 3, "visual": 0, "depth": 1, "interest": 2, "transform": 2, "total": 8}, "primary_topic": "地下出版", "secondary_topic": "独立杂志", function getEra(post) {
  const eras = post.era_keywords || [];
  for (const e of eras) {
    if (String(e).startsWith('196')) return '1960s';
    if (String(e).startsWith('197')) return '1970s';
  }
  return '';
}
function getFirstImage(post) {
  const urls = post.image_urls || [];
  return urls.length > 0 ? urls[0] : '';
}
function renderCards(list) {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';
  for (const p of list) {
    const img = getFirstImage(p);
    const imgHtml = img ? '<img class="card-image" src="' + img + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
    const ucTags = (p.content_use_cases || []).map(uc => '<span class="topic-tag">' + uc + '</span>').join('');
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.slug = p.slug;
    div.innerHTML =
      '<div class="card-header"><div class="card-title">' + (p.title||'') + '</div><div class="card-score">' + (p.p2_total_score||0) + '</div></div>' +
      '<div class="card-meta">' + (p.date ? p.date.split('T')[0] : '') + ' &middot; ' + (p.image_count||0) + ' 图</div>' +
      '<div class="card-topics"><span class="topic-tag">' + (p.primary_topic||'') + '</span><span class="topic-tag">' + (p.secondary_topic||'') + '</span></div>' +
      imgHtml +
      '<div class="card-excerpt">' + ((p.first_paragraph||'').substring(0,180)) + '...</div>' +
      '<div class="card-topics">' + ucTags + '</div>' +
      '<div class="card-actions">' +
      '<button onclick="window.open(\'' + (p.url||'') + '\',\'_blank\')">阅读原文</button>' +
      '<button onclick="copyCardBySlug(\'' + (p.slug||'') + '\')">复制知识卡片</button>' +
      '<button onclick="copyPrompt(\'' + (p.slug||'') + '\')">复制Prompt</button>' +
      '</div>';
    container.appendChild(div);
  }
}
function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const topic = document.getElementById('topicFilter').value;
  const era = document.getElementById('eraFilter').value;
  const minScore = parseInt(document.getElementById('scoreFilter').value);
  const activeUCs = Array.from(document.querySelectorAll('.tag-btn.active')).map(b => b.dataset.uc);
  const filtered = posts.filter(p => {
    if (topic && p.primary_topic !== topic) return false;
    if (era && getEra(p) !== era) return false;
    if ((p.p2_total_score || 0) < minScore) return false;
    if (activeUCs.length > 0) {
      const pUCs = p.content_use_cases || [];
      if (!activeUCs.some(uc => pUCs.includes(uc))) return false;
    }
    if (q) {
      const hay = (p.title + ' ' + (p.first_paragraph||'') + ' ' + (p.tags||[]).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderCards(filtered);
}
function toggleUseCase(btn) {
  btn.classList.toggle('active');
  applyFilters();
}
function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('topicFilter').value = '';
  document.getElementById('eraFilter').value = '';
  document.getElementById('scoreFilter').value = 0;
  document.getElementById('scoreVal').textContent = '0';
  document.querySelectorAll('.tag-btn.active').forEach(b => b.classList.remove('active'));
  applyFilters();
}
function randomArticle() {
  const idx = Math.floor(Math.random() * posts.length);
  const p = posts[idx];
  alert('随机推荐：\n\n' + p.title + '\nP2分数: ' + (p.p2_total_score||0) + '\n' + p.url);
}
function copyCardBySlug(slug) {
  const p = posts.find(x => x.slug === slug);
  if (!p) return;
  const text = ('\ud83d\udccc ' + p.title + '\n\ud83c\udff7 ' + (p.primary_topic||'') + ' / ' + (p.secondary_topic||'') + '\n\u2b50 P2=' + (p.p2_total_score||0) + '\n\ud83d\udd17 ' + p.url + '\n\ud83d\udcdd ' + (p.first_paragraph||'')).substring(0,500);
  navigator.clipboard.writeText(text).then(() => alert('\u5df2\u590d\u5236\u77e5\u8bc6\u5361\u7247'));
}
function copyCard(idx) {
  const p = posts[idx];
  if (!p) return;
  const text = ('\ud83d\udccc ' + p.title + '\n\ud83c\udff7 ' + (p.primary_topic||'') + ' / ' + (p.secondary_topic||'') + '\n\u2b50 P2=' + (p.p2_total_score||0) + '\n\ud83d\udd17 ' + p.url + '\n\ud83d\udcdd ' + (p.first_paragraph||'')).substring(0,500);
  navigator.clipboard.writeText(text).then(() => alert('\u5df2\u590d\u5236\u77e5\u8bc6\u5361\u7247'));
}
function copyPrompt(slug) {
  const p = posts.find(x => x.slug === slug);
  if (!p) return;
  const eraText = (p.era_keywords || []).join(', ') || 'unknown';
  const mediaText = (p.media_keywords || []).join(', ') || 'mixed media';
  const text = ('Style: ' + (p.primary_topic||'') + '\nEra: ' + eraText + '\nSubject: ' + p.title + '\nVisual: ' + mediaText + '\nMood: 1960s counterculture, psychedelic, underground press aesthetic\n--no modern, corporate, sterile, generic').substring(0,800);
  navigator.clipboard.writeText(text).then(() => alert('\u5df2\u590d\u5236 Prompt \u79cd\u5b50\u8bcd'));
}
renderCards(posts);
</script>
